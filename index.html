<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Match 3</title>
    <style>
        body {
          font-family: Arial;
          text-align: center;
        }

        #board {
          display: grid;
          grid-template-columns: repeat(6, 60px);
          grid-gap: 5px;
          justify-content: center;
          margin-top: 20px;
        }

        .cell {
          width: 60px;
          height: 60px;
          font-size: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #eee;
          cursor: pointer;
        }

        .selected {
          outline: 3px solid red;
        }
    </style>
</head>
<body>

<h1>Три в ряд</h1>
<p id="status">Соберите 10 комбинаций</p>

<div id="board"></div>

<script>
    const size = 6;
    const emojis = ["🍎", "🍌", "🍇", "🍊"];
    let board = [];
    let selected = null;
    let score = 0;

    function init() {
      const boardEl = document.getElementById("board");
      boardEl.innerHTML = "";

      board = [];

      for (let i = 0; i < size * size; i++) {
        const value = emojis[Math.floor(Math.random() * emojis.length)];
        board.push(value);

        const div = document.createElement("div");
        div.className = "cell";
        div.dataset.index = i;
        div.textContent = value;

        div.addEventListener("click", onClick);

        boardEl.appendChild(div);
      }
    }

    function onClick(e) {
      const index = e.target.dataset.index;

      if (selected === null) {
        selected = index;
        e.target.classList.add("selected");
      } else {
        swap(selected, index);
        selected = null;
        render();
        checkMatches();
      }
    }

    function swap(i, j) {
      [board[i], board[j]] = [board[j], board[i]];
    }

    function render() {
      document.querySelectorAll(".cell").forEach((cell, i) => {
        cell.textContent = board[i];
        cell.classList.remove("selected");
      });
    }

    function checkMatches() {
      let matched = false;

      for (let i = 0; i < board.length; i++) {
        const row = Math.floor(i / size);
        const col = i % size;

        // горизонталь
        if (col < size - 2) {
          if (board[i] === board[i+1] && board[i] === board[i+2]) {
            matched = true;
          }
        }

        // вертикаль
        if (row < size - 2) {
          if (board[i] === board[i+size] && board[i] === board[i+2*size]) {
            matched = true;
          }
        }
      }

      if (matched) {
        score++;
        document.getElementById("status").textContent = "Очки: " + score;

        if (score >= 10) {
          document.body.innerHTML = "<h1>Перекур мальчики девочки?)</h1>";
        }
      }
    }

    init();
</script>

</body>
</html>
